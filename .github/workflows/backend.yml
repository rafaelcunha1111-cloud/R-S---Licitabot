name: Backend PostgreSQL e segurança
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Senha exclusiva do banco efêmero de CI; não é credencial de produção.
          POSTGRES_PASSWORD: fixture-ci-only
          POSTGRES_DB: licitabot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check && npm test && npm run build
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:fixture-ci-only@localhost:5432/licitabot_test
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: docker build -t licitabot-backend:test backend
