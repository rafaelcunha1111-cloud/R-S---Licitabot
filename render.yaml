# Modelo revisável: os planos/custos devem ser conferidos no provedor.
# Use PostgreSQL gerenciado com backups; URL interna Render ou URL externa com TLS validado.
envVarGroups:
  - name: licitabot-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: auto
      - key: FRONTEND_ORIGIN
        value: https://rafaelcunha1111-cloud.github.io
services:
  - type: web
    name: licitabot-api
    runtime: docker
    plan: starter
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    preDeployCommand: node dist/migrate.js
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: licitabot-shared
  - type: worker
    name: licitabot-worker
    runtime: docker
    plan: starter
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: node dist/worker.js
    envVars:
      - fromGroup: licitabot-shared
